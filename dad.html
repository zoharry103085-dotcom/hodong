<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>호동이 아빠뷰</title>
  <link rel="manifest" href="/hodong/dad-manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="호동이 아빠">
  <meta name="theme-color" content="#05D194">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #05D194, #03A876);
      font-family: -apple-system, sans-serif;
      padding: 40px 24px;
    }
    .icon { font-size: 72px; margin-bottom: 20px; }
    .title { font-size: 26px; font-weight: 800; color: #fff; margin-bottom: 8px; }
    .sub { font-size: 15px; color: rgba(255,255,255,0.75); margin-bottom: 48px; }
    .enter-btn {
      display: block;
      background: #fff; color: #05D194;
      padding: 18px 48px; border-radius: 18px;
      font-size: 18px; font-weight: 800;
      text-decoration: none;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      margin-bottom: 40px;
    }
    .hint {
      font-size: 13px; color: rgba(255,255,255,0.75);
      text-align: center; line-height: 1.8;
      background: rgba(255,255,255,0.12);
      border-radius: 14px; padding: 16px 20px; max-width: 300px;
    }
    .hint strong { color: #fff; }
  </style>
</head>
<body>
  <div class="icon">🐾</div>
  <div class="title">호동이 아빠뷰</div>
  <div class="sub">환서 활동 현황 확인</div>
  <a class="enter-btn" href="/hodong/?dadview=true">아빠뷰 열기 →</a>
  <div class="hint">
    📱 <strong>홈 화면 앱으로 추가하려면</strong><br>
    지금 이 페이지에서<br>
    공유 버튼 → 홈 화면에 추가
  </div>
</body>
</html>
